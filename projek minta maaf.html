<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sayang aku minta maaf🥺💗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Poppins', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6ea, #fff0f3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .heart-bg {
      position: absolute;
      color: #ffb6c1;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 15px 30px rgba(255, 105, 180, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 4px solid #ffb6c1;
      position: relative;
      z-index: 10;
      animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .gif-container img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      color: #ff4d6d;
      font-size: 1.8rem;
      margin: 15px 0 10px;
    }

    p {
      color: #6c757d;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-yes {
      background-color: #ff4d6d;
      color: white;
    }

    .btn-yes:hover {
      background-color: #ff758f;
      transform: scale(1.1);
    }

    .btn-no {
      background-color: #ffb6c1;
      color: #ffffff;
      position: relative;
    }

    .success-message {
      display: none;
    }

    .success-message h2 {
      color: #ff4d6d;
      font-size: 1.6rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div id="hearts-container"></div>

  <div class="card" id="main-card">
    <div class="gif-container">
  <img id="status-gif" src="https://media.giphy.com/media/L95W4wv8nnb9K/giphy.gif" alt="Sad Cute Cat">
</div>
    
    <div id="text-content">
      <h1>sayang maafin aku ya 🥺</h1>
      <p>aku minta maaf nah seng karna tadi udah marah marah, eh tapi itu sebanarnya ga marah marah sih tapi lebih ke kesel karna kamu lebih pilih ke ade ade an mu ketimbang pilih mabar sama aku hmzz... jangan kesel lagi ya sayang ? 💗</p>
      
      <div class="btn-group">
        <button class="btn-yes" id="yes-btn" onclick="acceptApology()">Maafin 💖</button>
        <button class="btn-no" id="no-btn" onclick="moveButton()">Nggak! 😜</button>
      </div>
    </div>
  </div>

  <script>

    function createHearts() {
      const container = document.getElementById('hearts-container');
      const heartSymbols = ['🌸', '💖', '✨', '💕', '🌷'];
      
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-bg');
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        container.appendChild(heart);
      }
    }
    createHearts();

    let clickCount = 0;
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');

    function moveButton() {
      clickCount++;
      
      const currentYesSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
      yesBtn.style.fontSize = (currentYesSize + 6) + 'px';
      yesBtn.style.padding = `${12 + clickCount * 4}px ${24 + clickCount * 8}px`;

      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    function acceptApology() {
      const mainCard = document.getElementById('main-card');
      const gif = document.getElementById('status-gif');
      const textContent = document.getElementById('text-content');

      gif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmZ2bmZ3eTFwOHdxeWd4aGthbnd6ZHhvdjB6eXl6bzFpODFqZHRjdyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif";

      textContent.innerHTML = `
        <div class="success-message" style="display:block;">
          <h2>makasih yaa sayangkuuu cintakuuu 🥰🎉</h2>
          <p>yeeey karna sayang udah klik maafin aku berarti aku dimaafin nih hehehe, bales chat aku yaa sayang karna aku gatau nah karna sayang gada online nya nah ihh susah banget tau buat tau kondisinya sayang gimana. kita baikan yaa sayangkuu cintakuu. love you! 💖✨</p>
        </div>

      `;
    }
  </script>
</body>
</html>
